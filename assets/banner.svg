<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter for Shield & Highlights -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -80;
        }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.96); opacity: 0.5; }
        50% { transform: scale(1.04); opacity: 0.85; }
        100% { transform: scale(0.96); opacity: 0.5; }
      }
      .circuit-line {
        stroke-dasharray: 8, 12;
        animation: dash 3s linear infinite;
      }
      .floating-pill-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .shield-pulse {
        transform-origin: 600px 72px;
        animation: pulseRing 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="1196" height="396" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="6" y="6" width="1188" height="388" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Dynamic Circuit Background Grid (Behind Text) -->
  <g opacity="0.18">
    <line x1="100" y1="0" x2="100" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Transaction Flow Stream (Running horizontally in background) -->
  <g opacity="0.65">
    <path d="M 0 60 Q 300 120 600 60 T 1200 60" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="8, 12" class="circuit-line">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 0 340 Q 300 280 600 340 T 1200 340" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="8, 12" class="circuit-line">
      <animate attributeName="stroke-dashoffset" from="0" to="80" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Floating Status Pills (Placed around borders so they don't cover central title) -->
  <g class="floating-pill-1" transform="translate(60, 48)">
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#pillGlow)" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">ALLOW: $250.00</text>
  </g>

  <g class="floating-pill-2" transform="translate(960, 48)">
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#pillGlow)" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" />
    <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">HITL ESCALATION</text>
  </g>

  <g class="floating-pill-2" transform="translate(60, 318)">
    <rect width="195" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" filter="url(#pillGlow)" />
    <circle cx="18" cy="17" r="5" fill="#6366f1" />
    <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">KYA PROTOCOL (AP2)</text>
  </g>

  <g class="floating-pill-1" transform="translate(945, 318)">
    <rect width="195" height="34" rx="17" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" filter="url(#pillGlow)" />
    <circle cx="18" cy="17" r="5" fill="#ec4899" />
    <text x="32" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">CAP: $1,000 / DAY</text>
  </g>

  <!-- Center Shield Icon with Pulse (Upper Center) -->
  <g class="shield-pulse">
    <circle cx="600" cy="72" r="30" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#shieldGlow)" />
    <!-- Shield Graphic -->
    <path d="M 600 55 L 617 62 C 617 77 600 88 600 88 C 600 88 583 77 583 62 Z" fill="url(#shieldGrad)" />
    <path d="M 595 72 L 599 76 L 606 68" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always in front, high-contrast, perfectly readable) -->
  <!-- Dark backing plate for guaranteed contrast -->
  <rect x="110" y="118" width="980" height="175" rx="14" fill="#0a0f1d" fill-opacity="0.88" stroke="#1e293b" stroke-width="1" />

  <!-- Main Title -->
  <text x="600" y="172" text-anchor="middle" fill="url(#titleGrad)" font-size="33" font-weight="800" letter-spacing="-0.3">
    Awesome Agent Financial Transaction Gatekeepers
  </text>

  <!-- Subtitle -->
  <text x="600" y="214" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="500" letter-spacing="0.2">
    Autonomous AI Agent Payment Authorization &#8226; Budget Guardrails &#8226; Spend Governance
  </text>

  <!-- Tags Row -->
  <g transform="translate(600, 252)">
    <!-- Tag 1 -->
    <rect x="-310" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="-245" y="4" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">🛡️ Policy Gates</text>
    
    <!-- Tag 2 -->
    <rect x="-165" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="-90" y="4" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">🤖 Agentic Payments</text>

    <!-- Tag 3 -->
    <rect x="0" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="70" y="4" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">💳 Card Issuance</text>

    <!-- Tag 4 -->
    <rect x="155" y="-14" width="155" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="232" y="4" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">👤 Human-in-the-Loop</text>
  </g>
</svg>
